<!DOCTYPE html>
<html>
<head>
    <title>Table Tag</title>
</head>

<body>

    <h1 align ="center"><u> Table Tag </u></h1>

    <h2><u> Colspan Tag </u></h2>

    <table border="1" cellspacing ="0" cellpadding="5">
        <tr>
            <th colspan="4">Title</th>
        </tr>

        <tr>
            <th colspan="2">Subtitle</th>
            <th colspan="2">Subtitle</th>
        </tr>

        <tr>
            <td>1 item</td>
            <td>123</td>
            <td>1 item</td>
            <td>123</td>
        </tr>

        <tr>
            <td>1 item</td>
            <td>123</td>
            <td>1 item</td>
            <td>123</td>
        </tr>

        <tr>
            <td>1 item</td>
            <td>123</td>
            <td>1 item</td>
            <td>123</td>
        </tr>

        <tr>
            <th colspan="2"> Subtitle </th>
            <th colspan="2"> Subtitle </th>
        </tr>
    </table>

    <hr>

    <h2><u>Rowspan Tag</u></h2>

    <table border="1" cellspacing="0" cellpadding="5">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td rowspan="3">1</td>
            <td rowspan="3">David</td>
            <td>Maths</td>
            <td>80</td>
        </tr>

        <tr>
            <td>Physics</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Computer</td>
            <td>70</td>
        </tr>

        <tr>
            <td rowspan="3">2</td>
            <td rowspan="3">Alex</td>
            <td>Maths</td>
            <td>80</td>
        </tr>

        <tr>
            <td>Physics</td>
            <td>70</td>
        </tr>

        <tr>
            <td>Computer</td>
            <td>90</td>
        </tr>

    </table>

</body>
</html>
